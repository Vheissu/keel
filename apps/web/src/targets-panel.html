<div class="section-title">
  <h2>Private deployment agents</h2>
  <div class="header-actions">
    <button class="button secondary" click.trigger="refresh()" disabled.bind="loading || busy">
      Refresh targets
    </button>
    <button class="button primary" if.bind="canWrite" click.trigger="open('agent')">
      Register agent
    </button>
    <button
      class="button secondary"
      if.bind="canWrite"
      click.trigger="open('target')"
      disabled.bind="!data || !data.agents.length || !projects.length"
    >
      Add target
    </button>
  </div>
</div>
<p class="muted">
  Agents connect outward over mutual TLS. Each deployment target belongs to one project, environment
  and agent.
</p>
<p class="alert error" role="alert" if.bind="error">${error}</p>
<p class="alert success" role="status" if.bind="notice">${notice}</p>
<div class="loading-inline" role="status" if.bind="loading">
  <boat-mark animated.bind="true"></boat-mark>
  <span>Loading targets…</span>
</div>
<form class="target-form" if.bind="form" submit.trigger:prevent="save()">
  <h3>${formTitle}</h3>
  <label>
    Name
    <input
      ref="nameInput"
      value.bind="name"
      readonly.bind="form === 'certificate'"
      required
      maxlength="100"
      autocomplete="off"
    />
  </label>
  <label if.bind="form !== 'target'">
    Certificate SHA-256 fingerprint
    <input value.bind="fingerprint" required autocomplete="off" spellcheck="false" />
  </label>
  <template if.bind="form === 'certificate'">
    <p>
      Stop the old agent process first. Install the replacement certificate on the same private
      host, keeping the target allowlist, state directory and any SSH host settings. Existing
      deployment locks remain until cleanup succeeds.
    </p>
    <label class="check-label">
      <input type="checkbox" checked.bind="stopped" required />
      I stopped the old agent and will restart it on the same private host.
    </label>
  </template>
  <template if.bind="form === 'target'">
    <div>
      <label for="target-connection">Connection</label>
      <select id="target-connection" value.bind="capability">
        <option value="docker-recreate-v1">Local Docker</option>
        <option value="ssh-docker-recreate-v1">Docker over SSH</option>
      </select>
    </div>
    <p class="muted">Configure SSH addresses, keys and trusted host keys on the private agent.</p>
    <resource-picker
      api.bind="api"
      resource="projects"
      label="Project"
      input-id="targets-panel-projectId"
      value.bind="projectId"
    ></resource-picker>
    <resource-picker
      api.bind="api"
      resource="environments"
      label="Environment"
      input-id="targets-panel-environmentId"
      value.bind="environmentId"
    ></resource-picker>
    <resource-picker
      api.bind="api"
      resource="agents"
      state="active"
      label="Agent"
      input-id="targets-panel-agentId"
      value.bind="agentId"
    ></resource-picker>
    <label>
      Target labels (JSON)
      <textarea value.bind="labels" rows="3" required spellcheck="false"></textarea>
    </label>
  </template>
  <div class="header-actions">
    <button class="button primary" type="submit" disabled.bind="busy">
      ${form === 'certificate' ? 'Replace certificate' : 'Save registration'}
    </button>
    <button class="button secondary" type="button" click.trigger="closeForm()">Cancel</button>
  </div>
</form>
<template if.bind="data">
  <page-controls pager.bind="agents" label="Agents"></page-controls>
  <div class="table-wrap" tabindex="0" role="region" aria-label="Registered agents">
    <table>
      <thead>
        <tr>
          <th>Agent</th>
          <th>State</th>
          <th>Last connected</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr repeat.for="agent of data.agents">
          <td>
            <strong>${agent.name}</strong>
            <small><code>${agent.id}</code></small>
          </td>
          <td>${label(agent.state)}</td>
          <td>${date(agent.last_seen_at)}</td>
          <td class="row-actions">
            <button
              class="text-button"
              if.bind="canWrite && agent.state !== 'active'"
              disabled.bind="busy"
              click.trigger="replaceCertificate(agent)"
              aria-label.bind="'Replace certificate for ' + agent.name"
            >
              Replace certificate
            </button>
            <button
              class="text-button"
              if.bind="canWrite && agent.state === 'active'"
              disabled.bind="busy"
              click.trigger="setState(agent, 'draining')"
              aria-label.bind="'Drain ' + agent.name"
            >
              Drain
            </button>
            <button
              class="text-button"
              if.bind="canWrite && agent.state === 'draining'"
              disabled.bind="busy"
              click.trigger="setState(agent, 'active')"
              aria-label.bind="'Resume ' + agent.name"
            >
              Resume
            </button>
            <button
              class="text-button danger"
              if.bind="canWrite && agent.state !== 'revoked'"
              disabled.bind="busy"
              click.trigger="setState(agent, 'revoked')"
              aria-label.bind="'Revoke certificate for ' + agent.name"
            >
              Revoke certificate
            </button>
          </td>
        </tr>
      </tbody>
    </table>
    <div class="empty-state" if.bind="!data.agents.length">
      <boat-mark></boat-mark>
      <h3>No agents registered.</h3>
      <p>Register a client certificate fingerprint, then configure the agent on a private host.</p>
    </div>
  </div>
  <div class="section-title"><h2>Deployment targets</h2></div>
  <page-controls pager.bind="targets" label="Targets"></page-controls>
  <div class="table-wrap" tabindex="0" role="region" aria-label="Deployment targets">
    <table>
      <thead>
        <tr>
          <th>Target / allowlist ID</th>
          <th>Environment</th>
          <th>Agent</th>
          <th>Verified release</th>
        </tr>
      </thead>
      <tbody>
        <tr repeat.for="target of data.targets">
          <td>
            <strong>${target.name}</strong>
            <small>
              ${target.capability === 'ssh-docker-recreate-v1' ? 'Docker over SSH' : 'Local Docker'}
            </small>
            <small><code>${target.id}</code></small>
          </td>
          <td>${target.environment_name || environmentName(target.environment_id)}</td>
          <td>${target.agent_name || agentName(target.agent_id)}</td>
          <td>${target.current_state === 'verified' ? target.release_version : 'Unknown'}</td>
        </tr>
      </tbody>
    </table>
    <div class="empty-state" if.bind="!data.targets.length">
      <h3>No Deployment targets.</h3>
      <p>Add a target, then allow its ID and ports in the agent configuration.</p>
    </div>
  </div>
  <div class="section-title"><h2>Execution attempts</h2></div>
  <page-controls pager.bind="attempts" label="Attempts"></page-controls>
  <p class="muted">
    Reconciliation required means the target stays locked until its agent confirms cleanup. Refresh
    to see new results.
  </p>
  <div class="table-wrap" tabindex="0" role="region" aria-label="Execution attempts">
    <table>
      <thead>
        <tr>
          <th>Deployment</th>
          <th>Target</th>
          <th>State</th>
          <th>Fence</th>
          <th>Last reported step</th>
          <th>Result / next action</th>
        </tr>
      </thead>
      <tbody>
        <tr repeat.for="attempt of data.attempts">
          <td><code>${attempt.deployment_id}</code></td>
          <td>${attempt.target_name || targetName(attempt.target_id)}</td>
          <td>${label(attempt.state)}</td>
          <td>${attempt.fence}</td>
          <td>
            ${label(attempt.phase)}
            <small>${date(attempt.phase_updated_at)}</small>
          </td>
          <td>
            ${attempt.result_code ? label(attempt.result_code.toLowerCase()) : 'Pending'}
            <small>${guidance(attempt)}</small>
          </td>
        </tr>
      </tbody>
    </table>
    <div class="empty-state" if.bind="!data.attempts.length">
      <h3>No execution attempts.</h3>
      <p>A queued release needs a running workflow worker and one matching target.</p>
    </div>
  </div>
</template>
