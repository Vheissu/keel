name: keel
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: keel
      POSTGRES_PASSWORD: keel-local-only
      POSTGRES_DB: keel
    ports: ['127.0.0.1:55439:5432']
    volumes: ['postgres:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U keel']
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres:
