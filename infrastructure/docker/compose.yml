name: keel
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: keel
      POSTGRES_PASSWORD: keel-local-only
      POSTGRES_DB: keel
    ports: ['127.0.0.1:55439:5432']
    volumes: ['postgres:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U keel']
      interval: 2s
      timeout: 3s
      retries: 20
  temporal-data:
    image: busybox:1.37.0
    profiles: [execution]
    user: '0:0'
    command: chown 1000:1000 /data
    volumes: ['temporal:/data']
  temporal:
    image: temporalio/temporal:1.6.1
    profiles: [execution]
    depends_on:
      temporal-data:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'temporal', 'operator', 'cluster', 'health']
      interval: 2s
      timeout: 3s
      retries: 30
    command: server start-dev --ip 0.0.0.0 --db-filename /data/temporal.db
    ports: ['127.0.0.1:7233:7233', '127.0.0.1:8233:8233']
    volumes: ['temporal:/data']
  s3:
    image: rustfs/rustfs:1.0.1
    profiles: [storage]
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: keel-local
      RUSTFS_SECRET_KEY: keel-local-storage-only
    ports: ['127.0.0.1:59000:9000', '127.0.0.1:59001:9001']
    volumes: ['artifacts:/data']
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://localhost:9000/health']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  temporal:
  artifacts:
  postgres:
